name: Approve site changes

# Every few minutes: merge the pull requests Massimo approved in CampusCord
# (Admin → Site changes), close the ones he turned down, then rebuild the site.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: read

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm i --no-save --silent firebase-admin@12
      - name: Merge approved changes
        id: merge
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/merge.mjs
      - name: Test and publish changes sent from the Dev panel
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/devsubs.mjs
      # Merges made by this robot don't start other workflows, so rebuild the site here.
      - name: Rebuild the site
        if: steps.merge.outputs.merged != '' && steps.merge.outputs.merged != '0'
        run: |
          git pull -q origin main
          python3 src/build.py
          python3 -c "import re;h=open('index.html').read();m=re.search(r'<script type=\"module\">(.*?)</script>',h,re.S);open('/tmp/site.mjs','w').write(m.group(1) if m else 'throw')"
          if ! node --check /tmp/site.mjs; then echo "::error::Merged code has a mistake; NOT published."; git checkout -- index.html version.json; exit 1; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- index.html; then exit 0; fi
          git add index.html version.json
          git commit -m "Build site from src/ ($(jq -r .version version.json))"
          git push
