name: Deploy Firestore rules

# Tests firestore.rules in the Firestore emulator, then publishes them to Firebase
# whenever they change on main — so nobody has to paste rules by hand.
on:
  push:
    branches: [main]
    paths:
      - firestore.rules
      - firebase.json
      - tests/**
      - .github/workflows/deploy-rules.yml
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install test tools
        run: npm i --no-save --silent firebase-tools@13 @firebase/rules-unit-testing@3 firebase@10
      - name: Run rules tests in the emulator
        run: npx firebase emulators:exec --only firestore --project demo-campuscord "node tests/rules.test.mjs"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check the Firebase key is set
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Add the FIREBASE_SERVICE_ACCOUNT secret (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
      - name: Deploy rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: npx --yes firebase-tools@13 deploy --only firestore:rules --project campuscord-83dd3 --non-interactive
      - name: Remove key file
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
