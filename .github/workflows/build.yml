name: Build site

# When src/ changes on main (e.g. a merged pull request), rebuild index.html
# and version.json so the live site updates and open tabs offer a refresh.
on:
  push:
    branches: [main]
    paths:
      - src/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build index.html from src/
        run: python3 src/build.py
      - name: Safety check (never publish code that crashes)
        run: |
          python3 - <<'PY'
          import re
          h = open("index.html").read()
          m = re.search(r'<script type="module">(.*?)</script>', h, re.S)
          open("/tmp/site.mjs", "w").write(m.group(1) if m else "throw")
          PY
          if ! node --check /tmp/site.mjs; then
            echo "::error::The new code has a mistake, so it was NOT published. The site stays on the last working version."
            git checkout -- index.html version.json
            exit 1
          fi
      - name: Commit the build if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- index.html; then echo "Already up to date."; exit 0; fi
          git add index.html version.json
          git commit -m "Build site from src/ ($(jq -r .version version.json))"
          git push
